[project]
name = "telegram-autotune-bot"
version = "0.1.0"
description = "Telegram singing autotune bot with Telegram Stars, Neon PostgreSQL, and a Render worker"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1",
  "pydub>=0.25,<1",
]

[project.optional-dependencies]
separation = ["demucs>=4.0,<5"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["app", "audio", "worker.py"]
