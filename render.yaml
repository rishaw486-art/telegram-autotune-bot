services:
  - type: web
    name: telegram-autotune-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BOT_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

  - type: worker
    name: telegram-autotune-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MUSIC_DIR
        value: ./music
